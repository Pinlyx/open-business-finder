[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-business-finder"
version = "0.1.0"
description = "List local businesses in any country by region, district and category from open map data (Overture Maps). No API key, no browser, no Google scraping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pinlyx" }]
keywords = [
  "google-maps-scraper-alternative", "business-finder", "lead-generation", "overture-maps",
  "places", "poi", "local-business", "duckdb", "geojson", "cli", "open-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
channels = ["contactchannels @ git+https://github.com/Pinlyx/contact-channel-detector"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Pinlyx/open-business-finder"
Repository = "https://github.com/Pinlyx/open-business-finder"
Issues = "https://github.com/Pinlyx/open-business-finder/issues"

[project.scripts]
open-business-finder = "open_business_finder.cli:main"
obf = "open_business_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_business_finder = ["py.typed", "data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["spatial: needs the DuckDB spatial extension (skipped when it cannot be loaded)"]
